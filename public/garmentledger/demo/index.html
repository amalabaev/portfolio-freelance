<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ea">
  <meta name="robots" content="noindex,follow">
  <title>Contrôler une facture · GarmentLedger</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="./demo.css">
  <script defer src="./desk.js"></script>
  <script defer src="./evidence.js"></script>
  <script defer src="./foldout.js"></script>
  <script defer src="./motion.js"></script>
  <script defer src="./demo.js"></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a id="case-link" href="/work/garmentledger/"><span aria-hidden="true">←</span> <span id="case-label">Retour à l’étude</span></a>
      <span class="brand"><i aria-hidden="true"></i>GarmentLedger</span>
      <div class="languages" role="group" aria-label="Langue / Language">
        <button data-lang="fr" lang="fr" aria-label="Français" aria-pressed="true">FR</button>
        <button data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
      </div>
    </header>
    <main>
      <nav class="steps" id="steps" aria-label="Étapes du dossier"></nav>
      <section class="spread" aria-labelledby="title">
        <div class="lead">
          <p class="folio" id="folio"></p>
          <h1 id="title" tabindex="-1"></h1>
          <p id="intro"></p>
        </div>
        <div class="stage-figure">
          <div class="studio" id="studio"></div>
          <div class="scene-transport" hidden>
            <button type="button" id="motion-control" aria-controls="studio">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path id="motion-symbol" d="M6 4v12m7-12v12"></path>
              </svg>
              <span id="motion-label">Mettre en pause</span>
            </button>
            <span class="scene-track" aria-hidden="true"><i></i></span>
          </div>
        </div>
        <div class="controls" id="controls"></div>
      </section>
    </main>
    <footer><span id="foot-note">Dossier fictif · Montants en USD hors taxes</span><span>DEMO-1-002</span></footer>
  </div>
  <noscript>Active JavaScript pour tester la démo. Enable JavaScript to try the demo.</noscript>
</body>
</html>
